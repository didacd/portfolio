[package]
name = "portfolio"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[dependencies]
axum = "0.8.9"
dioxus = { version = "0.7.10", default-features = false, features = ["lib"] }
dioxus-mdx = { version = "0.10.2", default-features = false, features = ["components", "parse"] }
dioxus-ssr = "0.7.10"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-saphyr = { version = "1.3.0", default-features = false, features = ["deserialize"] }
tokio = { version = "1.53.2", features = ["fs", "macros", "net", "rt-multi-thread", "sync"] }
tower-http = { version = "0.7.1", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

[dev-dependencies]
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
